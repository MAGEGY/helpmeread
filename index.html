  <body>
    <div id="root"></div>
    <script>
      // Self-heal: if the app bundle fails to load (stale cached HTML after a
      // redeploy), unregister service workers and reload once to recover.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT' && !sessionStorage.getItem('hmr-heal')) {
          sessionStorage.setItem('hmr-heal', '1');
          var done = function () { location.reload(); };
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
              .then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              })
              .then(done, done);
          } else {
            done();
          }
        }
      }, true);
    </script>
  </body>
